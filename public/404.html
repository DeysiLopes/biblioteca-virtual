<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Minha Biblioteca</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages (rafgraph/spa-github-pages)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        path + '/?/' + route + query + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
