<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="description" content="Estante interativa, diário de leitura e notificações — funciona offline como app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Minha Biblioteca</title>
<style>
  :root{
    --paper:#f6ebd9; --paper2:#efe0c8; --ink:#43352a; --ink2:#6b5747;
    --wood:#8a5a33; --wood2:#6f4526; --accent:#b3541e; --green:#3e5c4a;
    --shadow:0 18px 40px -18px oklch(0.2 0.04 40 / 0.65);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, oklch(0.9 0.05 70 / .5), transparent 60%),
      linear-gradient(180deg, #fbf4e8, #f0e2c8 55%, #e5d2ab);
    background-attachment:fixed;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }
  .serif{font-family:"Cormorant Garamond",serif;}

  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top));
    background:linear-gradient(180deg, oklch(0.55 0.06 50 / .96), oklch(0.42 0.05 45 / .96));
    color:#f6ebd9; box-shadow:0 6px 24px -12px oklch(0 0 0 / .55);
  }
  header .logo{
    width:40px;height:40px;border-radius:10px;object-fit:cover;
    background:var(--paper); box-shadow:0 4px 10px -4px oklch(0 0 0 / .5);
  }
  header h1{font-size:19px; font-weight:800; letter-spacing:.3px; flex:1;}
  header h1 small{display:block; font-size:11px; font-weight:600; opacity:.75;}
  header .actions{display:flex; gap:6px; align-items:center;}
  .hbtn{
    border:1px solid oklch(1 0 0 / .25); background:oklch(1 0 0 / .08); color:#f6ebd9;
    border-radius:10px; padding:8px 10px; font:600 12px/1 "Nunito",sans-serif; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.2s;
  }
  .hbtn:hover{background:oklch(1 0 0 / .18);}
  .hbtn svg{width:16px;height:16px;flex:none;}
  .hbtn.ghost{opacity:.85;}
  @media(max-width:560px){ header h1 small{display:none;} .hbtn span{display:none;} }

  nav.tabs{
    display:flex; gap:6px; padding:12px 18px 0;
  }
  nav.tabs button{
    flex:1; font:800 15px "Nunito",sans-serif; padding:12px; border:none; cursor:pointer;
    border-radius:14px 14px 0 0; background:oklch(1 0 0 / .12); color:var(--ink2);
    transition:.2s; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  nav.tabs button.active{
    background:oklch(0.98 0.02 70 / .92); color:var(--ink); box-shadow:0 -6px 18px -14px oklch(0 0 0 / .4);
  }
  nav.tabs button svg{width:18px;height:18px;}

  main{padding:16px 18px 90px; max-width:1200px; margin:0 auto;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
  .pill{
    border:1px solid oklch(0.35 0.04 45 / .25); background:oklch(1 0 0 / .6); color:var(--ink2);
    border-radius:999px; padding:6px 12px; font:600 12px/1 "Nunito",sans-serif; cursor:pointer; transition:.15s;
  }
  .pill.on{background:var(--green); color:#f6ebd9; border-color:var(--green);}
  .pill::first-letter{text-transform:uppercase;}

  .statsRow{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; font-size:12.5px; color:var(--ink2);}
  .statsRow b{color:var(--ink);}

  /* estante */
  .shelf{ margin:26px 0 4px; }
  .shelf-head{ font:700 15px "Cormorant Garamond",serif; letter-spacing:.4px; color:var(--ink); margin:0 4px 10px; }
  .shelf-inner{
    display:grid; grid-template-columns:repeat(6,1fr); gap:14px;
    padding:18px 14px 6px; border-radius:16px 16px 6px 6px;
    background:
      radial-gradient(140% 90% at 50% -40%, oklch(0.62 0.08 60 / .28), transparent 55%),
      linear-gradient(180deg, var(--wood2), var(--wood));
    box-shadow:inset 0 -10px 22px -12px oklch(0 0 0 / .5), 0 10px 24px -18px oklch(0 0 0 / .6);
  }
  .book-card{ cursor:pointer; position:relative; }
  .cover-wrap{
    position:relative; width:100%; aspect-ratio:2/3; border-radius:4px 10px 10px 4px; overflow:hidden;
    background:var(--paper);
    box-shadow:0 16px 30px -14px oklch(0 0 0 / .65), inset 4px 0 8px -4px oklch(0 0 0 / .4);
    transition:transform .28s var(--ease), box-shadow .28s;
    transform-origin:50% 100%;
  }
  .book-card:hover .cover-wrap{ transform:scale(1.12) rotate(-1.5deg); box-shadow:0 26px 44px -16px oklch(0 0 0 / .7); }
  .book-card:active .cover-wrap{ transform:scale(1.06); }
  .cover-wrap img{ width:100%; height:100%; object-fit:cover; position:relative; z-index:1; }
  .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:"Cormorant Garamond",serif; font-weight:700; font-size:15px; letter-spacing:.3px;
    color:oklch(0.18 0.04 30 / .9); text-shadow:0 1px 0 oklch(1 0 0 / .35);
    background:linear-gradient(150deg, var(--g1), var(--g2));
  }
  .meta{ margin-top:7px; }
  .meta .t{ font:700 12.5px/1.25 "Nunito",sans-serif; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta .a{ font-size:11px; color:var(--ink2); display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .meta .dot{ display:flex; align-items:center; gap:5px; margin-top:4px; font-size:10.5px; color:var(--ink2); }
  .meta .dot i{ width:9px;height:9px;border-radius:50%; flex:none; }
  .progbar{ height:4px; border-radius:99px; background:oklch(0.5 0.02 40 / .25); margin-top:6px; overflow:hidden; }
  .progbar>div{ height:100%; background:var(--accent); border-radius:99px; }

  .rail{ height:18px; border-radius:6px 6px 16px 16px; background:linear-gradient(180deg, oklch(0.55 0.07 55 / .9), oklch(0.45 0.06 50 / .95)); margin-top:-3px; box-shadow:inset 0 2px 3px oklch(1 0 0 / .25), 0 8px 16px -10px oklch(0 0 0 / .5); }

  @media(max-width:900px){ .shelf-inner{grid-template-columns:repeat(4,1fr);} }
  @media(max-width:560px){ .shelf-inner{grid-template-columns:repeat(3,1fr); gap:10px;} .fallback{font-size:13px;} }

  #empty{padding:40px 10px; text-align:center; color:var(--ink2); font-size:14px;}

  /* modal (detalhe do livro) */
  #modal{
    position:fixed; inset:0; z-index:60; display:none;
    background:oklch(0.18 0.03 35 / .55); backdrop-filter:blur(6px);
  }
  #modal.open{display:block;}
  .fly-cover{
    position:fixed; z-index:70; border-radius:4px 12px 12px 4px; overflow:hidden;
    box-shadow:0 30px 70px -20px oklch(0 0 0 / .8);
    transition:left .55s var(--ease), top .55s var(--ease), width .55s var(--ease), height .55s var(--ease);
  }
  .fly-cover img,.fly-cover .fallback{width:100%; height:100%; position:absolute; inset:0;}
  .panel{
    position:fixed; z-index:65; opacity:0; transition:opacity .35s ease .25s;
    top:0; right:0; bottom:0; width:min(560px,100%); height:100%; overflow-y:auto;
    background:var(--paper); color:var(--ink); box-shadow:-30px 0 60px -30px oklch(0 0 0 / .7);
    padding:20px 22px calc(24px + env(safe-area-inset-bottom));
  }
  #modal.open .panel{opacity:1;}
  @media(max-width:760px){
    .panel{ width:100%; top:auto; bottom:0; height:62%; min-height:380px; border-radius:22px 22px 0 0; box-shadow:0 -20px 60px -20px oklch(0 0 0 / .7);}
  }
  .panel h2{font:700 24px/1.15 "Cormorant Garamond",serif;}
  .panel .sub{font-size:13px; color:var(--ink2); margin:2px 0 4px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .chip{ font:600 11.5px/1 "Nunito",sans-serif; padding:6px 9px; border-radius:8px; background:oklch(0.35 0.05 45 / .1); color:var(--ink2); }
  .chip b{color:var(--ink);}
  .field{margin:12px 0;}
  .field label{ display:block; font:700 11.5px "Nunito",sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--ink2); margin-bottom:6px; }
  .stars{ display:flex; gap:6px; }
  .stars span{ cursor:pointer; font-size:26px; line-height:1; color:oklch(0.3 0 0 / .18); transition:transform .15s, color .15s; }
  .stars span.on{ color:#e8a33d; transform:scale(1.12); }
  input[type=number],select,textarea{
    width:100%; font:600 14px "Nunito",sans-serif; color:var(--ink);
    background:oklch(1 0 0 / .65); border:1.5px solid oklch(0.4 0.04 45 / .25); border-radius:10px; padding:9px 11px; outline:none;
  }
  textarea{resize:vertical; min-height:54px;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .pp{display:flex; align-items:center; gap:8px; margin-top:4px; font-size:12px; color:var(--ink2);}
  .pp .bar{flex:1; height:6px; background:oklch(0.5 0.02 40 / .22); border-radius:99px; overflow:hidden;}
  .pp .bar>div{height:100%; background:var(--accent); border-radius:99px;}
  .mbtn{
    border:none; border-radius:12px; padding:11px; font:800 14px "Nunito",sans-serif; cursor:pointer; transition:.15s;
  }
  .mbtn.primary{background:var(--accent); color:#fbf4e8; width:100%;}
  .mbtn.primary:hover{filter:brightness(1.08);}
  .mbtn.ghost2{background:oklch(0.35 0.05 45 / .1); color:var(--ink2); padding:8px 12px; font:700 13px;}
  .mbtn.danger{background:oklch(0.6 0.15 25 / .12); color:#a03a1e;}
  .mfoot{display:flex; gap:8px; margin-top:14px; align-items:center;}
  .entry{ background:oklch(1 0 0 / .55); border-radius:10px; padding:9px 11px; margin-top:6px; font-size:13px; border:1px solid oklch(0.4 0.04 45 / .15); }
  .entry .d{font-size:11.5px; color:var(--ink2); display:flex; justify-content:space-between; gap:8px;}
  .entry .x{cursor:pointer; background:none; border:none; color:#a03a1e; font:800 13px "Nunito",sans-serif;}

  /* diário */
  #diaryView .dstats{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 14px;}
  .dbox{ flex:1; min-width:120px; background:oklch(1 0 0 / .55); border:1px solid oklch(0.4 0.04 45 / .18); border-radius:14px; padding:12px 14px; }
  .dbox .v{font:800 22px "Cormorant Garamond",serif; color:var(--ink);}
  .dbox .l{font-size:11.5px; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px;}
  .big{ width:100%; background:var(--green); color:#f6ebd9; border:none; border-radius:14px; padding:14px; font:800 15px "Nunito",sans-serif; cursor:pointer; box-shadow:var(--shadow); transition:.15s; }
  .big:hover{filter:brightness(1.08);}
  .day{ margin:16px 0; }
  .day h3{ font:700 15px "Nunito",sans-serif; color:var(--ink); border-bottom:1px dashed oklch(0.4 0.04 45 / .3); padding-bottom:6px; }
  .day .total{ float:right; font:700 12.5px; color:var(--accent); }
  .mbox{ display:flex; gap:10px; align-items:flex-start; background:oklch(1 0 0 / .6); border:1px solid oklch(0.4 0.04 45 / .16); border-radius:12px; padding:10px 12px; margin-top:8px; }
  .mbox img,.mbox .fbmini{ width:40px; height:58px; border-radius:3px 7px 7px 3px; object-fit:cover; flex:none; box-shadow:0 6px 12px -6px oklch(0 0 0 / .5); }
  .mbox .fbmini{ display:flex; align-items:center; justify-content:center; font:800 12px "Cormorant Garamond",serif; color:oklch(0.2 0 0 / .85); background:linear-gradient(150deg,var(--g1),var(--g2)); }
  .mbox .bd{ flex:1; }
  .mbox .bt{ font:700 13.5px; }
  .mbox .bp{ font-size:12px; color:var(--ink2); }
  .mbox .n{ font-size:12.5px; margin-top:3px; color:var(--ink); white-space:pre-wrap; }
  .mbox .x{cursor:pointer; background:none; border:none; color:#a03a1e; font:800 14px "Nunito",sans-serif;}

  /* form diário */
  #dform{ position:fixed; inset:0; z-index:80; display:none; background:oklch(0.18 0.03 35 / .5); backdrop-filter:blur(5px); align-items:flex-end; }
  #dform.open{ display:flex; }
  #dform .sheet{ width:100%; max-width:520px; margin:0 auto; background:var(--paper); border-radius:22px 22px 0 0; padding:18px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -20px 60px -20px oklch(0 0 0 / .7); }
  #dform .sheet h2{font:700 20px "Cormorant Garamond",serif; margin-bottom:12px;}

  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#f6ebd9; padding:11px 18px; border-radius:12px; font:700 13px "Nunito",sans-serif;
    opacity:0; transition:.3s var(--ease); z-index:100; pointer-events:none; box-shadow:var(--shadow);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #loading{ padding:60px 20px; text-align:center; font:700 15px "Cormorant Garamond",serif; color:var(--ink2); }
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{ display:inline-block; width:20px;height:20px; border:3px solid oklch(0.4 0.05 45 / .25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
</style>
</head>
<body>

<header>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Minha Biblioteca <small>estante · diário · avisos</small></h1>
  <div class="actions">
    <button class="hbtn ghost" id="btnExport" title="Backup dos dados">⬇<span>Backup</span></button>
    <button class="hbtn ghost" id="btnImport" title="Importar CSV">⇪<span>CSV</span></button>
    <button class="hbtn ghost" id="btnInstall" title="Instalar como app" style="display:none">📱<span>Instalar</span></button>
    <button class="hbtn ghost" id="btnBell" title="Lembrete diário">🔔</button>
  </div>
</header>

<nav class="tabs">
  <button data-t="shelf" class="active" id="tabShelf">📚 Estante</button>
  <button data-t="diary" id="tabDiary">📖 Diário</button>
</nav>

<main>
  <section id="shelfView">
    <div class="filters" id="filters"></div>
    <div class="statsRow" id="statsShelf"></div>
    <div id="shelves"></div>
    <p id="empty" hidden>Nenhum livro aqui. Use "CSV" para adicionar.</p>
  </section>

  <section id="diaryView" hidden>
    <div class="dstats" id="dstats"></div>
    <button class="big" id="btnAddDiary">＋ Registrar leitura de hoje</button>
    <div id="diaryList"></div>
  </section>
</main>

<input type="file" id="fileCSV" accept=".csv,.txt" hidden>

<div id="modal"></div>

<div id="dform">
  <div class="sheet">
    <h2>📖 Registrar leitura</h2>
    <div class="field"><label>Livro</label><select id="fbook"></select></div>
    <div class="row2">
      <div class="field"><label>Data</label><input type="date" id="fdate"></div>
      <div class="field"><label>Páginas lidas</label><input type="number" id="fpages" min="1" value="10"></div>
    </div>
    <div class="field"><label>Anotação (opcional)</label><textarea id="fnote" placeholder="O que rolou hoje no livro?"></textarea></div>
    <div class="mfoot">
      <button class="mbtn ghost2" id="fCancel">Cancelar</button>
      <button class="mbtn primary" id="fSave" style="flex:1">Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const STATUS = ["Quero ler","Lendo","Lido","Abandonado"];
const STATUS_COLOR = {"Quero ler":"#8a5a33","Lendo":"#3e5c4a","Lido":"#b3541e","Abandonado":"#8d8577"};
const OVERRIDE = ["nota","comentarios","resenha","status","tipo","paginasLidas"];

/* ---------- IndexedDB ---------- */
const DB_NAME="biblioteca", DB_VER=1;
function idb(){ return new Promise((res,rej)=>{
  const rq=indexedDB.open(DB_NAME,DB_VER);
  rq.onupgradeneeded=()=>{ const db=rq.result;
    if(!db.objectStoreNames.contains("books")) db.createObjectStore("books",{keyPath:"id"});
    if(!db.objectStoreNames.contains("diary")) db.createObjectStore("diary",{keyPath:"id",autoIncrement:true});
    if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"k"});
  };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
});}
async function store(mode,name){ const db=await idb(); return db.transaction(name,mode).objectStore(name); }
function reqi(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function allOf(name){ return reqi((await store("readonly",name)).getAll()); }
async function putOf(name,v){ await reqi((await store("readwrite",name)).put(v)); }
async function delOf(name,k){ await reqi((await store("readwrite",name)).delete(k)); }

/* ---------- estado ---------- */
let BOOKS=[], DIARY=[], META={};
let fdStatus="todos", fdGenre="todos", lastTab="shelf", openRect=null, openTarget=null;
let deferredInstall=null;

function norm(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim(); }
const slug = t => norm(t).replace(/\s+/g,"-");
function pct(b){ return b.paginas>0 ? Math.min(100, Math.round(((b.paginasLidas||0)/b.paginas)*100)) : 0; }
function hashHue(s){ let h=0; for(const c of String(s)) h=(h*31 + c.charCodeAt(0))%360; return h; }
function fallback(title){ const h=hashHue(title); return {g1:`oklch(${0.72+((h%40)/100)} ${0.09} ${h})`, g2:`oklch(${0.5+((h%25)/100)} ${0.12} ${(h+45)%360})`, initials: norm(title).split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || (title&&title[0]||"?").toUpperCase() }; }
function statusDot(b){ return `<i style="background:${STATUS_COLOR[b.status]||"#bdb3a4"}"></i>`+ (b.status||"sem status"); }

/* ---------- catálogo ---------- */
async function loadCatalog(){
  let list=[];
  try{
    const r=await fetch("books.json",{cache:"no-cache"});
    list = r.ok ? await r.json() : [];
  }catch(e){ try{ list = JSON.parse(localStorage.getItem("bib-catalog")||"[]"); }catch(_){} }
  localStorage.setItem("bib-catalog", JSON.stringify(list));
  const existing = await allOf("books");
  const map = new Map(existing.map(b=>[b.id,b]));
  for(const row of list){
    const cur = map.get(row.id);
    const merged = Object.assign({}, row);
    if(cur) for(const k of OVERRIDE) if(cur[k]!==undefined && cur[k]!==null && cur[k]!=="") merged[k]=cur[k];
    map.set(row.id, merged);
  }
  const sorted=[...map.values()].sort((a,b)=>a.title.localeCompare(b.title,"pt"));
  const s=await store("readwrite","books");
  sorted.forEach(b=>s.put(b));
  BOOKS=sorted;
}

/* ---------- render estante ---------- */
function visibleBooks(){
  return BOOKS.filter(b=>{
    if(fdStatus!=="todos" && (b.status||"Sem status")!==fdStatus) return false;
    if(fdGenre!=="todos" && (b.genero||"")!==fdGenre) return false;
    return true;
  });
}
function renderFilters(){
  const genres=[...new Set(BOOKS.map(b=>b.genero).filter(Boolean))].sort();
  const wrap=$("#filters");
  wrap.innerHTML="";
  const mk=(label,key,val)=>`<button class="pill ${fdStatus===key&&val==="st"||fdGenre===key&&val==="g"?"on":""}" data-k="${val}" data-v="${key}">${label}</button>`;
  wrap.insertAdjacentHTML("beforeend", mk("Todos","todos","st"));
  STATUS.forEach(s=>wrap.insertAdjacentHTML("beforeend", mk(s,s,"st")));
  wrap.insertAdjacentHTML("beforeend", `<span style="width:1px;align-self:stretch;background:oklch(0.4 0.04 45 / .2)"></span>`);
  wrap.insertAdjacentHTML("beforeend", mk("Gênero: todos","todos","g"));
  genres.forEach(g=>wrap.insertAdjacentHTML("beforeend", mk(g,g,"g")));
  wrap.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{
    const k=p.dataset.v, v=p.dataset.k;
    if(k==="st") fdStatus=v; else fdGenre=v;
    renderFilters(); renderShelves();
  }));
}
function cardHTML(b){

  const tw = Math.min(0.46*iw, 470);
  const th = isMobile ? Math.min(0.5*ih, 430) : Math.min(0.82*ih, 640);
  openTarget = isMobile
    ? { left:(iw-tw)/2, top:ih*0.04, width:tw, height:th }
    : { left:Math.max(20,(iw-560-40-tw)/2+20), top:(ih-th)/2, width:tw, height:th };
  let flyHtml = b.cover
    ? `<img src="${b.cover}" alt="${(b.title||"").replace(/"/g,"&quot;")}" onerror="this.style.display='none'">`

function streak(){
  let n=0; const dates=new Set(DIARY.map(d=>d.date));

  if(dates.has(today())){

  }

}

/* ---------- CSV ---------- */
function detectDelim(head){
  const t=head.split("\t").length, s=head.split(";").length, c=head.split(",").length;
  const best=[["\t",t],[";",s],[",",c]].sort((a,b)=>b[1]-a[1])[0];
  return best[1]>=2 ? best[0] : ",";
}
function parseCSV(text, delim){
  const rows=[], cells=text.trim().split(/\r?\n/);
  for(const line of cells){
    const row=[]; let cur="", mq=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(mq){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else mq=false; } else cur+=ch; }
      else if(ch==='"') mq=true;
      else if(ch===delim){ row.push(cur); cur=""; }
      else cur+=ch;
    }
    row.push(cur);
    if(row.some(x=>String(x).trim()!=="")) rows.push(row.map(x=>String(x).trim()));
  }
  return rows;
}
function parseNum(v){ const n=parseFloat(String(v||"").trim().replace(/\.(?=\d{3})/g,"").replace(",",".")); return isNaN(n)?null:n; }
function normDate(v){
  v=String(v||"").trim(); if(!v) return null;
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ const [d,mo,y]=[+m[1],+m[2],m[3].length===2?2000+ +m[3]:+m[3]]; return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  return null;
}
function stNorm(v){
  const n=norm(String(v||""));
  if(!n) return "Quero ler";
  if(n.includes("abandon")||n.includes("dnf")) return "Abandonado";
  if(n.includes("lend")||n.includes("reading")||n.includes("andamento")) return "Lendo";
  if(n.includes("lid")||n.includes("read")||n.includes("finish")||n.includes("conclu")) return "Lido";
  if(n.includes("quero")||n.includes("para ler")||n.includes("tbr")||n.includes("to read")) return "Quero ler";
  return "Quero ler";
}
function scoreNorm(v){ const n=parseNum(v); if(n==null) return null; return n>5?Math.round(n/2) : n; }
function mapRow(head,row){
  const f={}; head.forEach((h,i)=>f[norm(h)]=i);
  const pick=(keys,def)=>{ for(const k of keys) if(f[k]!==undefined) return row[f[k]]; return def; };
  const title=pick(["titulo","title","nome","name","book","livro","book title","titulo do livro"]) || row[0];
  const author=pick(["autor","author","autora","writer","author name","autor (a)"] )|| row[1]||"";
  const pag=parseNum(pick(["paginas","pages","pagina","pags","no of pages","number of pages","page count"]));
  const not=scoreNorm(pick(["nota","rating","my rating","score","estrelas","stars","avaliacao"]));
  return {
    title:String(title||"").trim(), author:String(author).trim(),
    paginas:pag,
    nota: not,
    status: stNorm(pick(["status","estado","situacao","state"]))||"Quero ler",
    genero: pick(["genero","genre","categorias","category","shelf","bookshelves","categories"]) || "",
    formato: pick(["formato","format","binding"]) || "",
    idioma: pick(["idioma","language","lang","idioma principal"]) || "",
    tipo: pick(["tipo","type"]) || "",
    inicio: normDate(pick(["inicio","data inicio","data de inicio","date start","start","data inicio"])),
    fim: normDate(pick(["fim","data fim","data de fim","date finish","finish","date read","data que terminou"])),
    comentarios: pick(["comentarios","comentários","comments","notes","my notes","notas"]) || "",
    resenha: pick(["resenha","review","my review","rating text"]) || "",
    isbn: pick(["isbn","isbn13","isbn10"]),
  };
}
async function importCSV(file){
  const text=await file.text();
  const firstLine=text.trim().split(/\r?\n/)[0]||"";
  const delim=detectDelim(firstLine);
  const grid=parseCSV(text, delim);
  if(grid.length<2){ toast("CSV vazio ou inválido."); return; }
  const head=grid[0].map(x=>String(x).trim());
  const allTitles=new Set(await allOf("books").then(list=>list.map(b=>norm(b.title))));
  let added=0, skipped=0; const newBooks=[];
  for(const row of grid.slice(1)){
    const rec=mapRow(head,row);
    if(!rec.title) continue;
    const key=norm(rec.title);
    if(allTitles.has(key) || newBooks.some(n=>norm(n.title)===key)){ skipped++; continue; }
    allTitles.add(key);
    newBooks.push(Object.assign({ id:"imp:"+slug(rec.title)+":"+slug(rec.author).slice(0,20) }, rec, { cover:"", progresso:0, estrelas:null, ano:null }));
  }
  const s=await store("readwrite","books");
  newBooks.forEach(b=>s.put(b));
  BOOKS=[...(await allOf("books"))].sort((a,b)=>a.title.localeCompare(b.title,"pt"));
  added=newBooks.length;
  renderFilters(); renderShelves(); renderDiary();
  toast(`CSV: ${added} adicionado(s), ${skipped} duplicado(s)`);
  for(const b of newBooks.slice(0,20)){
    try{
      const q=`${encodeURIComponent(b.title)} ${encodeURIComponent(b.author)}`.trim();
      const r=await fetch(`https://openlibrary.org/search.json?q=${q}&limit=1&fields=cover_i`);
      const j=await r.json();
      const ci=j.docs&&j.docs[0]&&j.docs[0].cover_i;
      if(ci){ b.cover=`https://covers.openlibrary.org/b/id/${ci}-M.jpg`; await putOf("books",b); }
    }catch(_){}
  }
  renderShelves();
}

async function registerSW(){

  }

function notify(msg, title){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{ new Notification(title||"Minha Biblioteca",{body:msg, icon:"icon-192.png"}); }catch(_){}
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage({type:"notify", title, body:msg});
}
async function toggleBell(){
  if(!("Notification" in window)){ toast("Notificações não suportadas neste navegador."); return; }
  if(Notification.permission==="default"){
    const p=await Notification.requestPermission();
    if(p!=="granted"){ toast("Permissão negada 😕"); return; }
  }
  const on=!META.reminder;
  META.reminder=on? {time:"20:00"} : null;
  await putOf("meta",{k:"reminder", v:META.reminder});
  $("#btnBell").style.opacity = on?"1":"0.6";
  $("#btnBell").title = on?"Lembrete diário 20:00 (desativar)":"Ativar lembrete diário";
  if(on) toast("Lembrete diário ativado (20:00). Vou te avisar para registrar a leitura.");
  else toast("Lembrete desativado.");
  scheduleReminder();
}
function scheduleReminder(){
  const on=META.reminder; if(!on) return;
  const [h,m]=on.time.split(":").map(Number);
  const now=new Date(); const target=new Date(); 
  target.setHours(h,m,0,0);
  if(target<=now) target.setDate(target.getDate()+1);
  const delay=target-now;
  clearTimeout(scheduleReminder._t);
  scheduleReminder._t=setTimeout(()=>{
    notify(`Quanto você leu hoje? Abra o Diário e registre suas páginas 📖`);
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage({type:"schedule", title:"Hora de registrar a leitura 📖", body:"Quanto você leu hoje?", time:Date.now()+1000});
    scheduleReminder();
  }, Math.min(delay, 2147483647));
}

/* ---------- toasts / tabs / install ---------- */
let toastT;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }
function switchTab(t){
  lastTab=t;
  $("#tabShelf").classList.toggle("active",t==="shelf");
  $("#tabDiary").classList.toggle("active",t==="diary");
  $("#shelfView").hidden = t!=="shelf";
  $("#diaryView").hidden = t!=="diary";
}

window.addEventListener("appinstalled",()=>{ $("#btnInstall").style.display="none"; toast("App instalado! Viva 🎉"); });

async function init(){
  await registerSW();
  if(window.matchMedia("(display-mode: standalone)").matches) $("#btnInstall").style.display="none";
  window.addEventListener("beforeinstallprompt",(e)=>{
    e.preventDefault(); deferredInstall=e;
    $("#btnInstall").style.display="";
    $("#btnInstall").addEventListener("click",async()=>{
      deferredInstall.prompt(); const r=await deferredInstall.userChoice; deferredInstall=null;
      if(r.outcome==="accepted") $("#btnInstall").style.display="none";
    });
  });

  document.body.insertAdjacentHTML("afterbegin",'<div id="loading"><div class="spin"></div><br><br>abrindo a biblioteca…</div>');
  await loadCatalog();
  await loadData();
  $("#loading")?.remove();
  renderFilters(); renderShelves(); renderDiary();

  $("#tabShelf").addEventListener("click",()=>switchTab("shelf"));
  $("#tabDiary").addEventListener("click",()=>switchTab("diary"));
  $("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeBook(); });
  $("#btnAddDiary").addEventListener("click",()=>openDiaryForm());
  $("#fCancel").addEventListener("click",()=>$("#dform").classList.remove("open"));
  $("#fSave").addEventListener("click",saveDiaryEntry);
  $("#fdate").value=today();
  $("#btnImport").addEventListener("click",()=>$("#fileCSV").click());
  $("#fileCSV").addEventListener("change",e=>{ if(e.target.files[0]) importCSV(e.target.files[0]); e.target.value=""; });
  $("#btnExport").addEventListener("click",exportBackup);
  $("#btnBell").addEventListener("click",toggleBell);
  if(META.reminder){ $("#btnBell").style.opacity="1"; $("#btnBell").title="Lembrete diário (desativar)"; scheduleReminder(); }
}

init();
</script>
</body>
