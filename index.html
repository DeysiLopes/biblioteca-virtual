<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#150d15" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biblioteca" />
    <meta name="description" content="Estante interativa, diário de leitura e notificações — funciona offline como app." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minha Biblioteca — estante &amp; diário de leitura" />
    <meta property="og:description" content="PWA para acompanhar suas leituras: estante visual, diário, resenhas e citações. Funciona offline, instala como app, sincroniza com o Google Drive." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon-ghost.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>Minha Biblioteca</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- SPA 404 redirect unpacker -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- Recuperação de cache: recarrega se o app não montar (módulos 404/504) ou
         se um chunk dinâmico falhar, buscando a versão nova. Trava anti-loop. -->
    <script type="text/javascript">
      // Em dev (o Vite injeta /@vite/client), remove SWs antigos que serviriam build velho
      if (document.querySelector('script[src*="/@vite/client"]') && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
      window.addEventListener('vite:preloadError', function () {
        window.location.reload();
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          var last = +window.sessionStorage.getItem('bib-reload-ts') || 0;
          if (Date.now() - last < 120000) return;
          window.sessionStorage.setItem('bib-reload-ts', String(Date.now()));
          window.location.reload();
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
