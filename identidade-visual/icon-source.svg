  <g fill="#ffd98a">
    <path d="M84 96 l6 14 14 6 -14 6 -6 14 -6-14 -14-6 14-6z" opacity=".9"/>
    <path d="M428 70 l5 12 12 5 -12 5 -5 12 -5-12 -12-5 12-5z" opacity=".85"/>
    <path d="M60 400 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z" opacity=".7"/>
  </g>
  <path d="M452 330 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z" fill="#cdb4ff" opacity=".8"/>

  <!-- sombra no chão -->
  <ellipse cx="256" cy="420" rx="150" ry="26" fill="#1a0b2e" opacity=".5" filter="url(#soft)"/>

  <!-- fantasminha (lençol) -->
  <path d="M136 400 L136 214 C136 128 190 74 256 74 C322 74 376 128 376 214 L376 400
           C364 384 350 380 338 392 C326 404 312 404 302 392 C292 380 278 380 268 392
           C258 404 244 404 234 392 C224 380 210 380 200 392 C190 404 176 404 166 392
