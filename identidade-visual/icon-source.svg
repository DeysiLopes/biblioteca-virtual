  <ellipse cx="216" cy="186" rx="13" ry="17" fill="#241a33"/>
  <ellipse cx="296" cy="186" rx="13" ry="17" fill="#241a33"/>
  <path d="M242 218 q7 9 14 0 q7 9 14 0" fill="none" stroke="#241a33" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="196" cy="216" rx="16" ry="9" fill="#e88ab8" opacity=".4"/>
  <ellipse cx="316" cy="216" rx="16" ry="9" fill="#e88ab8" opacity=".4"/>

  <!-- gato preto no colo -->
  <ellipse cx="256" cy="348" rx="62" ry="70" fill="#18101f"/>
  <path d="M306 366 q66 16 58 -54" fill="none" stroke="#18101f" stroke-width="19" stroke-linecap="round"/>
  <circle cx="256" cy="272" r="47" fill="#18101f"/>
  <path d="M220 246 L204 200 L250 226 Z" fill="#18101f"/>
  <path d="M292 246 L308 200 L262 226 Z" fill="#18101f"/>
