  <ellipse cx="238" cy="273" rx="2.6" ry="8" fill="#241a33"/>
  <ellipse cx="274" cy="273" rx="2.6" ry="8" fill="#241a33"/>
  <ellipse cx="240" cy="372" rx="16" ry="12" fill="#221527"/>
  <ellipse cx="272" cy="372" rx="16" ry="12" fill="#221527"/>

