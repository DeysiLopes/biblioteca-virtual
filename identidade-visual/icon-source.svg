<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f45"/>
      <stop offset=".45" stop-color="#521b7d"/>
      <stop offset="1" stop-color="#8f2f8f"/>
    </linearGradient>
    <radialGradient id="glowPink" cx=".78" cy=".85" r=".75">
      <stop offset="0" stop-color="#e0559a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e0559a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTop" cx=".2" cy=".1" r=".6">
      <stop offset="0" stop-color="#cdb4ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cdb4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efeafc"/>
      <stop offset="1" stop-color="#cfc2ee"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowPink)"/>
  <rect width="512" height="512" fill="url(#glowTop)"/>

  <g id="art">
